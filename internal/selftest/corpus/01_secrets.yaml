# Synthetic, non-working credentials. Each value is split with {{break}} so secret
# scanners don't flag this file; the selftest loader removes the marker before use.
- id: sec-01-aws-example-key
  category: secrets
  description: AWS documented example access key ID in user prompt
  hook_event: UserPromptSubmit
  expect_action: BLOCK
  payload:
    hook_event_name: UserPromptSubmit
    prompt: "Please configure S3 with AWS_ACCESS_KEY_ID=AKIA{{break}}IOSFODNN7EXAMPLE"

- id: sec-02-aws-secret-key
  category: secrets
  description: AWS documented example secret access key
  hook_event: UserPromptSubmit
  expect_action: BLOCK
  payload:
    hook_event_name: UserPromptSubmit
    prompt: "aws_secret_access_key=wJalrXUtnFEMI{{break}}/K7MDENG/bPxRfiCYEXAMPLEKEY"

- id: sec-03-github-pat
  category: secrets
  description: Synthetic GitHub classic PAT in prompt
  hook_event: UserPromptSubmit
  expect_action: BLOCK
  payload:
    hook_event_name: UserPromptSubmit
    prompt: "Clone using token ghp_{{break}}000000000000000000000000000000000000"

- id: sec-04-github-fine-grained
  category: secrets
  description: Synthetic GitHub fine-grained PAT in Write tool
  hook_event: PreToolUse
  expect_action: BLOCK
  payload:
    hook_event_name: PreToolUse
    tool_name: Write
    tool_input:
      file_path: "/tmp/app/config.txt"
      content: "GH_TOKEN=github_pat_{{break}}11AAAAAAA0123456789abcdef_0123456789ABCDEFabcdef0123456789"

